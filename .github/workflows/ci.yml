name: CI

# tests/live is deliberately absent: it needs a real model server and spends
# tokens. Run it by hand when you change prompts or the model gateway.
on:
  push:
    branches: [master]
  pull_request:

jobs:
  # Everything that needs no service. This is the job that decides whether a
  # change is mergeable — 384 tests, and it includes tests/e2e, which despite
  # the name runs in-process against fakes.
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run --frozen playwright install --with-deps chromium
      - run: uv run --frozen pytest tests/unit tests/contract tests/browser tests/e2e -q

  # Repositories and migrations, against the same image the demo runs on.
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        # The database name must contain "test": the destructive cleanup in
        # tests/integration/conftest.py refuses to run against anything else.
        image: pgvector/pgvector:0.8.5-pg16-bookworm
        env:
          POSTGRES_DB: agent_test
          POSTGRES_USER: agent
          POSTGRES_PASSWORD: agent
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agent -d agent_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://agent:agent@localhost:5432/agent_test
      TEST_DATABASE_URL: postgresql://agent:agent@localhost:5432/agent_test
      # Without this the suite skips itself when the URL is missing, which in CI
      # would be a green run that tested nothing.
      REQUIRE_DB_INTEGRATION: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run --frozen alembic upgrade head
      - run: uv run --frozen pytest tests/integration -q

  # .env is git-ignored, but a token reaches a tracked file by being pasted into
  # a doc or a fixture, not by committing .env.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
